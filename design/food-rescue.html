<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food rescue · interface preview</title>
    <style>
      :root {
        --ink: #203735;
        --paper: #f7faf9;
        --green: #27664d;
        --amber: #8c5200;
        --red: #a82e36;
        --line: #d7e2db;
        --soft: #edf4ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.5 "Atkinson Hyperlegible",
          system-ui,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #246da5;
        outline-offset: 3px;
      }
      .preview {
        background: #e5ece9;
        padding: 12px max(20px, calc((100vw - 1080px) / 2));
        font-size: 13px;
        border-bottom: 1px solid #c8d5ce;
      }
      .preview p {
        margin: 0 0 9px;
      }
      .preview-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .preview select {
        width: auto;
        max-width: 300px;
        background: #fff;
        padding: 8px;
        border: 1px solid #8b9f96;
        border-radius: 5px;
      }
      .preview button {
        background: transparent;
        border: 1px solid #8b9f96;
        padding: 8px 12px;
        border-radius: 5px;
        min-height: 42px;
        font-size: 13px;
      }
      .preview .clock {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      .shell {
        max-width: 1080px;
        margin: auto;
        padding: 0 24px 60px;
      }
      .brandbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 26px 0;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-weight: 750;
        font-size: 20px;
        letter-spacing: -0.6px;
      }
      .brand:before {
        content: "";
        display: inline-block;
        width: 15px;
        height: 19px;
        border: 2px solid var(--green);
        border-radius: 2px;
        margin-right: 10px;
        vertical-align: -2px;
        background: linear-gradient(var(--green), var(--green)) 3px 5px/7px 2px
          no-repeat;
      }
      .identity {
        font-size: 13px;
        text-align: right;
      }
      .identity strong {
        display: block;
        font-size: 15px;
      }
      .pagehead {
        margin: 32px 0 24px;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #50695e;
        margin: 0 0 8px;
      }
      h1,
      h2,
      h3 {
        font-family:
          "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
        line-height: 1.2;
        margin: 0 0 12px;
        letter-spacing: -0.03em;
      }
      h1 {
        font-size: 34px;
      }
      h2 {
        font-size: 23px;
      }
      h3 {
        font-size: 18px;
      }
      p {
        margin: 0 0 14px;
      }
      .muted {
        color: #50665e;
      }
      .small {
        font-size: 13px;
      }
      .lead {
        max-width: 650px;
        font-size: 17px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr);
        gap: 24px;
        align-items: start;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 24px;
        margin-bottom: 20px;
      }
      .ticket {
        position: relative;
        border-top: 5px solid var(--green);
      }
      .ticket:after {
        content: "";
        display: block;
        border-top: 1px dashed #a4b9ac;
        margin-top: 24px;
      }
      .quantity {
        font-size: 46px;
        font-weight: 750;
        letter-spacing: -2px;
        line-height: 1.1;
      }
      .quantity span {
        font-size: 19px;
        letter-spacing: 0;
        font-weight: 500;
      }
      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 24px;
      }
      .fact span {
        display: block;
        font-size: 12px;
        color: #50665e;
      }
      .fact strong {
        font-size: 17px;
      }
      .food {
        font-size: 18px;
        margin-top: 12px;
      }
      .pill {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 650;
        background: var(--soft);
      }
      .warning {
        border-left: 3px solid var(--amber);
        background: #fff5e7;
        padding: 14px 16px;
        margin: 16px 0;
      }
      .problem {
        border-left-color: var(--red);
        background: #fff0f0;
      }
      .good {
        border-left: 3px solid var(--green);
        background: var(--soft);
        padding: 14px 16px;
        margin: 16px 0;
      }
      label {
        display: block;
        font-weight: 650;
        font-size: 14px;
        margin-bottom: 7px;
      }
      input:not([type="checkbox"]),
      select,
      textarea {
        width: 100%;
        padding: 11px 12px;
        color: var(--ink);
        background: #fff;
        border: 1px solid #91a69a;
        border-radius: 5px;
        min-height: 46px;
      }
      textarea {
        resize: vertical;
        min-height: 90px;
      }
      input[readonly] {
        background: var(--paper);
      }
      .field {
        margin-bottom: 18px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .check {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-weight: 450;
        line-height: 1.5;
      }
      .check input {
        margin-top: 5px;
        min-width: 18px;
        min-height: 18px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 11px 17px;
        border: 1px solid var(--green);
        background: var(--green);
        color: #fff;
        border-radius: 5px;
        font-weight: 650;
        text-decoration: none;
        line-height: 1.3;
      }
      .button.secondary {
        background: #fff;
        color: var(--green);
      }
      .button.danger {
        color: var(--red);
        background: #fff;
        border-color: #d9b0b4;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 20px;
      }
      .actions .button {
        flex-shrink: 0;
      }
      .divider {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 24px 0;
      }
      .subticket {
        padding: 18px 0;
        border-top: 1px solid var(--line);
      }
      .subticket:first-of-type {
        margin-top: 20px;
      }
      .subticket header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 10px;
      }
      .subticket header h3 {
        margin-bottom: 4px;
      }
      .subticket p:last-child {
        margin-bottom: 0;
      }
      .balances {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 24px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
        margin-bottom: 24px;
        font-size: 13px;
      }
      .balances strong {
        font-size: 20px;
        display: block;
      }
      .source {
        padding: 12px 14px;
        background: var(--paper);
        border-radius: 5px;
        font-size: 13px;
      }
      .source strong {
        display: block;
        margin-bottom: 3px;
      }
      details {
        margin-top: 16px;
      }
      summary {
        cursor: pointer;
        color: var(--green);
        font-size: 14px;
        font-weight: 600;
        min-height: 32px;
      }
      details > form {
        margin-top: 16px;
      }
      .history {
        padding: 0;
        list-style: none;
      }
      .history li {
        padding: 12px 0;
        border-top: 1px solid var(--line);
        font-size: 14px;
      }
      .history time {
        font-size: 12px;
        color: #50665e;
        display: block;
      }
      .empty {
        padding: 24px 0;
      }
      .empty p {
        max-width: 550px;
      }
      .code {
        font-size: 28px;
        letter-spacing: 5px;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }
      .notice:empty {
        display: none;
      }
      .notice {
        margin-top: 20px;
        padding: 12px 16px;
        border-left: 3px solid var(--green);
        background: #e9f2ed;
      }
      .notice.error {
        border-color: var(--red);
        background: #fff0f0;
      }
      .foot {
        font-size: 12px;
        color: #50665e;
        border-top: 1px solid var(--line);
        padding-top: 20px;
        margin-top: 28px;
      }
      .full {
        width: 100%;
      }
      @media (max-width: 720px) {
        .shell {
          padding: 0 18px 40px;
        }
        .preview {
          padding: 12px 18px;
        }
        .preview .clock {
          margin-left: 0;
          width: 100%;
        }
        .preview-controls {
          gap: 8px;
        }
        .preview-controls label {
          margin: 0;
        }
        .brandbar {
          padding: 20px 0;
        }
        .identity {
          max-width: 160px;
        }
        .grid {
          grid-template-columns: 1fr;
          gap: 0;
        }
        .panel {
          padding: 20px;
        }
        h1 {
          font-size: 29px;
        }
        .pagehead {
          margin: 26px 0 20px;
        }
        .actions .button {
          flex: 1;
        }
        .quantity {
          font-size: 41px;
        }
        .row {
          gap: 12px;
        }
        .facts {
          gap: 16px 10px;
        }
        .balances {
          gap: 10px 20px;
        }
        .preview select {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <aside class="preview" aria-label="Preview controls">
      <p>
        <strong>Interface preview</strong> · Fictional partners and scripted
        suggestions. No messages are sent. Changes stay in this tab.
      </p>
      <div class="preview-controls">
        <label for="role">Preview as</label>
        <select id="role">
          <option value="kitchen">Asha · City Kitchen</option>
          <option value="desk">Lee · rescue coordinator</option>
          <option value="riverside">Maya · Riverside Shelter</option>
          <option value="bridge">Omar · Bridge Centre</option>
        </select>
        <button type="button" id="next">Start with the kitchen</button
        ><span class="clock" id="clock"></span
        ><button type="button" id="advance">Advance 10 minutes</button
        ><button type="button" id="reset">Start over</button>
      </div>
    </aside>
    <div class="shell">
      <header class="brandbar">
        <span class="brand">Food rescue</span>
        <div class="identity" id="identity"></div>
      </header>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <main id="app"></main>
      <footer class="foot">
        Design review · one meal-box offer, two receiving partners. This preview
        does not validate food policy, run AI, authenticate users, or connect to
        IRIS.
      </footer>
    </div>
    <script>
      "use strict";
      const storageKey = "food-rescue-preview-v1";
      const partners = [
        {
          id: "riverside",
          name: "Riverside Shelter",
          person: "Maya",
          need: 35,
          pickup: "18:00",
          receiveBy: "19:00",
          travelMinutes: 15,
          code: "314159",
          entrance: "Reception door on River Lane",
          source:
            "We can use 35 boxes. Our van should be back around six; let me check.",
          sourceTime: "5:45 PM",
        },
        {
          id: "bridge",
          name: "Bridge Centre",
          person: "Omar",
          need: 45,
          pickup: "18:10",
          receiveBy: "18:45",
          travelMinutes: 20,
          code: "271828",
          entrance: "Side entrance by the community hall",
          source:
            "We can take 45 boxes today. I can collect at 6:10 and we receive until 6:45.",
          sourceTime: "5:40 PM",
        },
      ];
      function fresh() {
        return {
          now: 17 * 60 + 55,
          role: "kitchen",
          offer: null,
          requests: {},
          events: [],
          question: false,
        };
      }
      let state;
      try {
        state = JSON.parse(sessionStorage.getItem(storageKey)) || fresh();
        if (
          !Array.isArray(state.events) ||
          !state.requests ||
          !Number.isInteger(state.now) ||
          !["kitchen", "desk", ...partners.map((p) => p.id)].includes(
            state.role,
          )
        )
          state = fresh();
      } catch {
        state = fresh();
      }
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      function mins(value) {
        const [h, m] = String(value).split(":").map(Number);
        return h * 60 + m;
      }
      function time(value) {
        const n = typeof value === "number" ? value : mins(value);
        return `${Math.floor(n / 60) % 12 || 12}:${String(n % 60).padStart(2, "0")} ${n >= 720 ? "PM" : "AM"}`;
      }
      function active(r) {
        return r && ["offered", "help", "accepted"].includes(r.status);
      }
      function left() {
        if (!state.offer) return 0;
        return (
          state.offer.quantity -
          state.offer.stopped -
          Object.values(state.requests)
            .filter(active)
            .reduce((n, r) => n + r.quantity, 0)
        );
      }
      function windowOpen() {
        return state.offer && state.now < mins(state.offer.by);
      }
      function log(actor, text) {
        state.events.unshift({ at: state.now, actor, text });
      }
      function expire() {
        for (const p of partners) {
          const r = state.requests[p.id];
          if (
            r &&
            ["offered", "help"].includes(r.status) &&
            state.now >= r.until
          ) {
            r.status = "expired";
            log(
              "System",
              `${p.name}'s unaccepted hold for ${r.quantity} boxes expired. No pickup was confirmed.`,
            );
          }
        }
      }
      function save() {
        sessionStorage.setItem(storageKey, JSON.stringify(state));
      }
      function notice(message, error = false) {
        const el = document.getElementById("notice");
        el.textContent = message;
        el.className = "notice" + (error ? " error" : "");
      }
      function history() {
        return `<details><summary>What happened</summary><ol class="history">${state.events.map((e) => `<li><time>${time(e.at)} · ${esc(e.actor)}</time>${esc(e.text)}</li>`).join("") || "<li>No offer has been posted.</li>"}</ol></details>`;
      }
      function head(title, sub, eyebrow = "Today · Monday, 9 November") {
        return `<div class="pagehead"><p class="eyebrow">${eyebrow}</p><h1 id="page-title" tabindex="-1">${title}</h1><p class="lead muted">${sub}</p></div>`;
      }
      function facts() {
        const o = state.offer;
        return `<p class="food">${esc(o.food)}</p><span class="pill">${esc(o.allergens)} · kitchen-declared</span><div class="facts"><div class="fact"><span>Ready from</span><strong>${time(o.from)}</strong></div><div class="fact"><span>Collect by</span><strong>${time(o.by)}</strong></div><div class="fact"><span>Pickup contact</span><strong>Asha</strong></div><div class="fact"><span>Entrance</span><strong>Rear kitchen door</strong></div><div class="fact"><span>Kitchen holding information</span><strong>${o.holding === "chilled" ? "Kept chilled" : o.holding === "hot" ? "Kept hot" : "Not recorded"}</strong></div><div class="fact"><span>Packaging</span><strong>Sealed meal boxes</strong></div></div>`;
      }
      function balance() {
        const rs = Object.values(state.requests);
        const waiting = rs
          .filter((r) => ["offered", "help"].includes(r.status))
          .reduce((n, r) => n + r.quantity, 0);
        const booked = rs
          .filter((r) => r.status === "accepted" && !r.picked)
          .reduce((n, r) => n + r.quantity, 0);
        const travelling = rs
          .filter((r) => r.picked && r.received === null)
          .reduce((n, r) => n + r.quantity, 0);
        const received = rs.reduce((n, r) => n + (r.received || 0), 0);
        const unresolved = rs.reduce(
          (n, r) =>
            n +
            (r.received !== null && !r.outcome ? r.quantity - r.received : 0),
          0,
        );
        const returned = rs.reduce(
          (n, r) =>
            n + (r.outcome?.kind === "returned" ? r.quantity - r.received : 0),
          0,
        );
        const damaged = rs.reduce(
          (n, r) =>
            n + (r.outcome?.kind === "damaged" ? r.quantity - r.received : 0),
          0,
        );
        return `<div class="balances"><div><strong>${left()}</strong>${windowOpen() ? "available to offer" : "unassigned at close"}</div><div><strong>${waiting}</strong>waiting for reply</div><div><strong>${booked}</strong>pickup confirmed</div><div><strong>${travelling}</strong>with collector</div><div><strong>${received}</strong>received</div>${unresolved ? `<div><strong>${unresolved}</strong>need follow-up</div>` : ""}${returned ? `<div><strong>${returned}</strong>reported returned</div>` : ""}${damaged ? `<div><strong>${damaged}</strong>reported damaged</div>` : ""}${state.offer.stopped ? `<div><strong>${state.offer.stopped}</strong>withdrawn from offer</div>` : ""}</div>`;
      }
      function status(r) {
        if (!r) return "Not offered";
        if (r.status === "declined") return "Declined";
        if (r.status === "expired") return "Reply window ended";
        if (r.status === "help") return "Collection help requested";
        if (r.status === "offered") return "Waiting for reply";
        if (r.received !== null)
          return r.received < r.quantity
            ? r.outcome
              ? "Receipt and outcome recorded"
              : "Receipt needs follow-up"
            : "Received";
        if (r.picked) return "Collected · receipt needed";
        if (!windowOpen()) return "Pickup not recorded · window ended";
        return "Pickup confirmed";
      }
      function empty(title, text) {
        return (
          head(title, text) +
          `<div class="panel empty"><h2>No food offer yet</h2><p>In this scenario, Asha first posts the kitchen's 80 meal boxes. Use the preview menu to open City Kitchen.</p></div>`
        );
      }
      function offerForm() {
        return (
          head(
            "Offer food",
            "Tell the rescue desk what is available and when someone can collect it.",
          ) +
          `<div class="grid"><form class="panel" data-form="offer"><div class="field"><label for="food">What is available?</label><input id="food" name="food" value="Rice, chickpea curry and yogurt" required maxlength="180"></div><div class="field"><label for="quantity">Number of meal boxes</label><input id="quantity" name="quantity" type="number" min="1" step="1" value="80" required><p class="small muted">One sealed meal per box. Packed in disposable carry cartons.</p></div><div class="row"><div class="field"><label for="from">Ready from</label><input id="from" name="from" type="time" value="17:40" required></div><div class="field"><label for="by">Collect by</label><input id="by" name="by" type="time" value="18:20" required></div></div><div class="field"><label for="allergens">Ingredients and allergens</label><input id="allergens" name="allergens" value="Contains milk" required maxlength="180"><p class="small muted">Use the kitchen's known information. Do not guess missing details.</p></div><div class="field"><label for="holding">How is the food being held?</label><select id="holding" name="holding" required><option value="chilled">Kept chilled</option><option value="hot">Kept hot</option><option value="unknown">Not confirmed yet</option></select><p class="small muted">Share the kitchen’s actual holding information. This is not a food-safety certificate.</p></div><label class="check"><input type="checkbox" name="handling" required><span>These are sealed meal boxes. The listed food details come from the kitchen.</span></label><div class="actions"><button class="button" type="submit" data-offer-button>Offer 80 meal boxes</button></div></form><aside class="panel ticket"><h2>Your pickup details</h2><p><strong>City Kitchen</strong><br>Rear kitchen door, Market Lane</p><p>Asha will be present for collection.</p><p class="small muted">These details come from the kitchen's partner profile. This preview uses fictional locations.</p><hr class="divider"><h3>What happens next?</h3><p>The coordinator reviews recipients. You will see who accepts, the quantity, and the agreed pickup time.</p><p class="small muted">Posting does not confirm a pickup.</p></aside></div>`
        );
      }
      function kitchen() {
        if (!state.offer) return offerForm();
        const rs = partners.filter((p) => state.requests[p.id]);
        const complete =
          Object.values(state.requests)
            .filter(active)
            .reduce((n, r) => n + (r.received || 0), 0) ===
          state.offer.quantity;
        return (
          head(
            complete ? "The boxes have been received" : "Your food offer",
            complete
              ? "Both receiving partners confirmed what arrived."
              : "See who is coming and record each physical handoff.",
          ) +
          balance() +
          `<div class="grid"><section class="panel ticket"><div class="quantity">${state.offer.quantity} <span>meal boxes offered</span></div>${facts()}${!rs.length ? '<div class="warning"><strong>No pickup confirmed yet.</strong><br>The rescue desk needs to send offers to receiving partners.</div>' : ""}${!windowOpen() ? '<div class="warning"><strong>The collection window has ended.</strong><br>Unrecorded pickups need coordinator follow-up. No new acceptance is allowed.</div>' : ""}${rs
            .map((p) => {
              const r = state.requests[p.id];

          render();
          notice(
            `Handoff recorded for ${r.quantity} boxes. Waiting for receiving staff to confirm what arrived.`,
          );
        } else if (kind === "receipt") {
          const actual = Number(data.get("actual")),
            problem = data.get("problem").trim();
          if (
            !r?.picked ||
            r.received !== null ||
            !Number.isInteger(actual) ||
            actual < 0 ||
            actual > r.quantity ||
            !problem
          )
            return notice(
              "Use the actual accepted count and explain the difference. This receipt must follow collection.",
              true,
            );
          receipt(p, r, actual, problem);
        } else if (kind === "outcome") {
          const source = data.get("source").trim(),
            note = data.get("note").trim(),
            outcome = data.get("kind");
          if (
            !r ||
            r.received === null ||
            r.received >= r.quantity ||
            r.outcome ||
            !source ||
            !note ||
            !["returned", "damaged"].includes(outcome)
          )
            return notice(
              "Record the confirmed outcome, source, and explanation for the outstanding boxes.",
              true,
            );
          r.outcome = { kind: outcome, source, note };
          log(
            "Lee",
            `${r.quantity - r.received} boxes for ${p.name} ${outcome === "returned" ? "reported returned to the kitchen" : "reported damaged"}, confirmed by ${source}. ${note}`,
          );
          render();
          notice(
            "Outcome recorded separately. The received count is unchanged.",
          );
        }
      });
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        expire();
        const p = partners.find((p) => p.id === button.dataset.partner),
          r = p ? state.requests[p.id] : null;
        const action = button.dataset.action;
        if (action === "stop") {
          const quantity = left();
          state.offer.stopped += quantity;
          log(
            "Asha",
            `Stopped offering the ${quantity} unassigned boxes. Existing commitments remain.`,
          );
          render();
          notice(`${quantity} unassigned boxes are no longer being offered.`);
        } else if (
          action === "help" &&
          r &&
          ["offered", "help"].includes(r.status) &&
          windowOpen()
        ) {
          r.status = "help";
          log(
            p.person,
            `Requested collection help for ${r.quantity} boxes. No pickup confirmed.`,
          );
          render();
          notice(
            `Lee needs to arrange collection. The hold still ends at ${time(r.until)}.`,
          );
        } else if (
          action === "decline" &&
          r &&
          ["offered", "help"].includes(r.status)
        ) {
          r.status = "declined";
          log(p.person, `Declined ${r.quantity} boxes. The hold was released.`);
          render();
          notice(
            "Offer declined. Those boxes can be offered to another partner.",
          );
        } else if (
          action === "receive-all" &&
          r?.picked &&
          r.received === null
        ) {
          receipt(p, r, r.quantity, "");
        }
      });
      render();
    </script>
  </body>
</html>
