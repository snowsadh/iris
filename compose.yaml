name: food-rescue

services:
  iris-data-init:
    image: food-rescue/iris-aihub:2027.1.0AI.109.0
    pull_policy: never
    user: root
    entrypoint: ["/bin/sh"]
    command: ["-c", "chown irisowner:irisowner /durable"]
    restart: "no"
    volumes:
      - iris-data:/durable

  iris:
    image: food-rescue/iris-aihub:2027.1.0AI.109.0
    pull_policy: never
    restart: unless-stopped
    shm_size: 1gb
    depends_on:
      iris-data-init:
        condition: service_completed_successfully
    environment:
      ISC_DATA_DIRECTORY: /durable/iris
      PYTHONPATH: /opt/allfedo/python:/usr/irissys/lib/python:/usr/irissys/mgr/python
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-50}
      ALLFEDO_PUBLIC_URL: ${ALLFEDO_PUBLIC_URL:-http://127.0.0.1:52773/allfedo/}
    ports:
      - 127.0.0.1:${IRIS_WEB_PORT:-52773}:52773
      - 127.0.0.1:${IRIS_SUPERSERVER_PORT:-1972}:1972
    volumes:
      - iris-data:/durable
      - ./src/Allfedo:/opt/allfedo/Allfedo:ro
      - ./src/python:/opt/allfedo/python:ro
      - ./src/web:/opt/allfedo/web:ro

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - 127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025
    volumes:
      - mail-data:/data

volumes:
  iris-data:
  mail-data:
