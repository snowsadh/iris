name: food-rescue

services:
  iris:
    image: food-rescue/iris-aihub:2027.1.0AI.109.0
    pull_policy: never
    restart: unless-stopped
    shm_size: 1gb
    environment:
      ISC_DATA_DIRECTORY: /durable/iris
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - 127.0.0.1:${IRIS_WEB_PORT:-52773}:52773
      - 127.0.0.1:${IRIS_SUPERSERVER_PORT:-1972}:1972
    volumes:
      - iris-data:/durable
      - ./src/Allfedo:/opt/allfedo/Allfedo:ro
      - ./src/python:/opt/allfedo/python:ro

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - 127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025
    volumes:
      - mail-data:/data

volumes:
  iris-data:
  mail-data:
